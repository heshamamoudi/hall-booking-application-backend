version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hallapp-postgres
    environment:
      POSTGRES_USER: hallapp
      POSTGRES_PASSWORD: DevPassword123!
      POSTGRES_DB: hallbooking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hallapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
